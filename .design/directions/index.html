<!doctype html>
<!--
  Direction board. Copy to <project>/.design/directions/index.html and edit the DIRECTIONS array.
  Each direction is its own self-contained HTML file in the same folder.
  The board is deliberately plain so it does not compete with the directions.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design directions</title>
<style>
  :root { --bg: #16171a; --panel: #1f2125; --line: #33363c; --text: #eceef1; --dim: #9aa0aa; --hi: #ffffff; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 6px 12px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--hi); }
  .seg button:focus-visible { outline: 2px solid var(--hi); outline-offset: -2px; }
  main { display: grid; gap: 16px; padding: 16px; }
  main[data-view="grid"] { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  main[data-view="one"] { grid-template-columns: 1fr; }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  article[hidden] { display: none; }
  .meta { padding: 12px 14px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
  .meta .row { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
  .meta h2 { margin: 0; font-size: 15px; }
  .meta p { margin: 0; color: var(--dim); }
  .meta a { color: var(--text); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tags span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--dim); }
  .frame { position: relative; background: #000; }
  .frame iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
</style>
</head>
<body>
<header>
  <h1 id="title">Design directions</h1>
  <div class="seg" role="group" aria-label="Layout">
    <button data-view="grid" aria-pressed="true">Side by side</button>
    <button data-view="one" aria-pressed="false">One at a time</button>
  </div>
  <div class="seg" role="group" aria-label="Viewport">
    <button data-w="1440" aria-pressed="true">Desktop 1440</button>
    <button data-w="390" aria-pressed="false">Mobile 390</button>
  </div>
  <div class="seg" id="picker" role="group" aria-label="Direction" hidden></div>
</header>
<main data-view="grid" id="board"></main>
<script>
// EDIT THIS
const PROJECT = 'ProofPay';
const DIRECTIONS = [
  { file: 'a-redacted.html', name: 'A — Redacted (Clear Day)', idea: 'The product is a redacted document: only the proven claim is visible, picked out in marker yellow.', best: 'Best at: explaining selective disclosure, dense tables, print-like trust.', risk: 'Risk: quiet; relies on typography and one asset.', tags: ['Instrument Sans + Plex Mono (documents only)', 'cool white + ink + marker yellow', 'typographic attestation sheet', 'stepped, mechanical'] },
  { file: 'b-descent.html', name: 'B — Descent (Deep Navy)', idea: 'Settlement is a beam of light descending through an exploded stack: worker, source, attestor, verifier, escrow.', best: 'Best at: premium feel, the mechanism in one image, calm dark app.', risk: 'Risk: dark-premium family; must stay far from neon/terminal.', tags: ['Archivo wide, no mono', 'deep navy + one warm light', 'computed exploded stack', 'weighty, cinematic'] },
  { file: 'c-sentence.html', name: 'C — Sentence (Porcelain)', idea: 'A payment is a sentence you assemble from tactile parts. The hero is a working tool: edit the rule, fund, prove.', best: 'Best at: first-use clarity, try-before-signup.', risk: 'Risk: soft UI can feel low-contrast in dense tables.', tags: ['Red Hat Display', 'glaze white + cobalt', 'tactile objects + live demo', 'springy'] },
  { file: 'd-route.html', name: 'D — Route', idea: 'Settlement is a transit line: stations are the real task states, refund and dispute are branch lines.', best: 'Best at: showing the state machine at a glance; signage clarity.', risk: 'Risk: transit metaphor must stay secondary to the product UI.', tags: ['Barlow Condensed + Barlow', 'cool grey + 3 line colours', 'computed route map', 'mechanical, stepped'] },
  { file: 'e-specimen.html', name: 'E — Specimen', idea: 'The proof as a security-printed certificate: computed guilloché, microprint, a seal; SPECIMEN where simulated.', best: 'Best at: memorable, premium, honest about simulation.', risk: 'Risk: brave for fintech; engraving cues can read as ornamental.', tags: ['Manrope', 'pale blue paper + 2 inks', 'guilloché security print', 'ambient sheen'] },
  { file: 'f-ink-arch.html', name: 'F — Ink Arch', idea: 'Two-tone page with oversized curves; the real Proof Inspector rises out of an ink arch.', best: 'Best at: product-led storytelling, conversion, contrast.', risk: 'Risk: closest to current fintech launch pages; the curves must carry identity.', tags: ['Bricolage Grotesque', 'light + ink + electric blue', 'staged real UI', 'scroll-linked'] },
  { file: 'g-thread.html', name: 'G — Thread', idea: 'A task is a short conversation between payer, worker and escrow; every state is a message.', best: 'Best at: plain-language onboarding, agent-era feel.', risk: 'Risk: chat metaphor can undersell the audit-grade ledger.', tags: ['Onest', 'black / white / sky', 'message thread UI', 'elastic'] },
  { file: 'h-section.html', name: 'H — Section', idea: 'The settlement drawn as an engineering section A–A: hatching = private, balloons = parts, title block = status.', best: 'Best at: trust through precision, explains layers, distinctive.', risk: 'Risk: technical tone may feel cold to non-technical payers.', tags: ['Chivo + Chivo Mono', 'graphite + safety orange', 'section drawing', 'draw-on, stepped'] },
  { file: 'i-weight.html', name: 'I — Weight', idea: 'Proof gains weight: the headline goes hairline to black as the settlement progresses. No accent colour.', best: 'Best at: bold typographic identity, dense data app.', risk: 'Risk: mono-ink may feel austere; relies on variable-font performance.', tags: ['Roboto Flex (variable)', 'grey + one ink', 'variable type', 'axis motion'] },
];
// END EDIT
document.getElementById('title').textContent = PROJECT + ' — design directions';
const board = document.getElementById('board'), picker = document.getElementById('picker');
let width = 1440, view = 'grid', current = 0;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
DIRECTIONS.forEach((d, i) => {
  const a = document.createElement('article');
  a.innerHTML = `<div class="meta"><div class="row"><h2>${esc(d.name)}</h2><a href="${esc(d.file)}" target="_blank" rel="noopener">Open full page</a></div>
    <p>${esc(d.idea)}</p><p>${esc(d.best)} ${esc(d.risk)}</p>
    <div class="tags">${d.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div></div>
    <div class="frame"><iframe src="${esc(d.file)}" title="${esc(d.name)}" loading="lazy"></iframe></div>`;
  board.appendChild(a);
  const b = document.createElement('button'); b.textContent = d.name.split(' ')[0]; b.dataset.i = i; b.setAttribute('aria-pressed', i === 0);
  picker.appendChild(b);
});
function layout() {
  board.dataset.view = view; picker.hidden = view !== 'one';
  [...board.children].forEach((a, i) => {
    a.hidden = view === 'one' && i !== current;
    const frame = a.querySelector('.frame'), f = a.querySelector('iframe');
    const avail = frame.clientWidth || a.clientWidth, scale = Math.min(1, avail / width);
    const h = width < 600 ? 844 : 900;
    f.style.width = width + 'px'; f.style.height = (view === 'one' ? Math.max(h, (innerHeight - 170) / scale) : h) + 'px';
    f.style.transform = `scale(${scale})`;
    frame.style.height = parseFloat(f.style.height) * scale + 'px';
    f.style.marginLeft = width < 600 && scale === 1 ? Math.max(0, (avail - width) / 2) + 'px' : '0';
  });
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { if (b.tagName !== 'BUTTON') return; view = b.dataset.view; press(b); layout(); }));
document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => { width = +b.dataset.w; press(b); layout(); }));
picker.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; current = +b.dataset.i; press(b); layout(); });
function press(b) { [...b.parentElement.children].forEach((x) => x.setAttribute('aria-pressed', x === b)); }
addEventListener('resize', layout); requestAnimationFrame(layout);
</script>
</body>
</html>
